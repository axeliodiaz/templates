<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumen native gauge</title><link rel="stylesheet" href="./lumen-gauge.css"><style>body{margin:0;padding:24px;background:#fbfbfa;color:#17171a;font-family:system-ui}body[data-theme=dark]{background:#17171a;color:#f1f1f5}main{max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}.card{border:1px solid #7775;border-radius:14px;padding:20px;display:grid;justify-items:center}button,input{font:inherit}button{padding:8px 12px;margin:0 8px 16px 0}label{display:block;margin:20px 0}input{width:100%}</style><main><h1>Lumen native gauge</h1><p>Framework-free SVG. The same Motion spring as the Vue gauge, with reduced-motion support. Demo values only.</p><button id="theme">Toggle theme</button><button id="update">Update values</button><div class="grid"><section class="card" id="arc"></section><section class="card" id="needle"></section><section class="card" id="both"></section></div><label>CPU load <input id="value" type="range" min="0" max="100" value="62"></label><p id="status" role="status">Ready</p></main><script type="module">
import {createLumenGauge} from './lumen-gauge.js';
const arc=createLumenGauge(document.querySelector('#arc'),{value:62,label:'Progress',unit:'%'});
const needle=createLumenGauge(document.querySelector('#needle'),{value:132,max:240,mode:'needle',ticks:12,labels:['0','40','80','120','160','200','240'],unit:'km/h',label:'Speedometer',zones:[{from:200,to:240,color:'#d23b3b'}]});
const both=createLumenGauge(document.querySelector('#both'),{value:62,mode:'both',ticks:10,unit:'%',label:'CPU load',zones:[{from:85,to:100,color:'#d23b3b'}]});
window.gauges={arc,needle,both};window.gaugesReady=Promise.all([arc.ready,needle.ready,both.ready]);
document.querySelector('#theme').onclick=()=>document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark';
document.querySelector('#value').oninput=e=>both.update({value:Number(e.target.value)});
document.querySelector('#update').onclick=async()=>{await Promise.all([arc.update({value:85}),needle.update({value:210}),both.update({value:91})]);document.querySelector('#status').textContent='Updated locally';};
</script></html>
