<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Independent multi-series gauges</title><link rel="stylesheet" href="./lumen-gauge.css"><style>body{font:14px system-ui;margin:0;padding:20px;background:#fafafa;color:#17171a}body[data-theme=dark]{background:#12141c;color:#f4f4f5}main{max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:18px}section{border:1px solid #8885;border-radius:16px;padding:20px;display:grid;justify-items:center}button{font:inherit;padding:10px;margin:0 8px 18px 0}</style><main><h1>Independent limits, one gauge</h1><p>Fictional data. Each ring has its own range and value. Missing values are not zero.</p><button id="theme">Toggle theme</button><button id="update">Update values</button><div class="grid"><section id="two"></section><section id="three"></section><section id="edge"></section></div><p role="status" id="status">Ready</p></main><script type="module">
import{createMultiGauge}from'./multi-gauge.js';
const two=createMultiGauge(document.querySelector('#two'),{label:'Two independent limits',series:[{id:'included',label:'Included usage',value:100,color:'#d97706',detail:'Allowance exhausted'},{id:'demand',label:'On-demand usage',value:0,detail:'Zero used'}]});
const three=createMultiGauge(document.querySelector('#three'),{label:'Three independent limits',series:[{id:'short',label:'Five-hour window',value:0,detail:'100% remaining'},{id:'week',label:'Weekly limit',value:29,detail:'71% remaining'},{id:'month',label:'Monthly spend',value:34.97,max:15000,unit:'USD',detail:'Resets in 24d'}]});
const edge=createMultiGauge(document.querySelector('#edge'),{label:'Missing and over-limit',series:[{id:'unknown',label:'Unavailable measurement',value:null},{id:'over',label:'Above allowance',value:125},{id:'under',label:'Below range',value:-10}]});
window.multi={two,three,edge};window.multiReady=Promise.all([two.ready,three.ready,edge.ready]);document.querySelector('#theme').onclick=()=>document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark';document.querySelector('#update').onclick=async()=>{await two.update({series:[{id:'included',label:'Included usage',value:62},{id:'demand',label:'On-demand usage',value:14}]});document.querySelector('#status').textContent='Updated locally';};
</script></html>
